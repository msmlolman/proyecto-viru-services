# spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/riego_viru

spring.datasource.username=viru_admin
spring.datasource.password=tu_contraseña_aqui

viru.admin-code=${VIRU_ADMIN_CODE}
viru.ingest-api-key=${VIRU_INGEST_API_KEY}
viru.jwt.secret=${VIRU_JWT_SECRET}
viru.jwt.expiration-minutes=240

# Evitar que Spring modifique tus tablas existentes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

viru.correo.habilitado=${VIRU_CORREO_HABILITADO:false}
viru.correo.remitente=${VIRU_CORREO_REMITENTE:}
viru.correo.destino-prueba=${VIRU_CORREO_DESTINO_PRUEBA:}
spring.mail.host=${VIRU_SMTP_HOST:}
spring.mail.port=${VIRU_SMTP_PORT:587}
spring.mail.username=${VIRU_SMTP_USUARIO:}
spring.mail.password=${VIRU_SMTP_CLAVE:}
spring.mail.properties.mail.smtp.auth=${VIRU_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${VIRU_SMTP_TLS:true}
spring.mail.properties.mail.smtp.starttls.required=${VIRU_SMTP_TLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.task.scheduling.pool.size=2
